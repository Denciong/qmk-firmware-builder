name: Build Custom Firmware
on:
  push:
  workflow_dispatch:
env:
  QMK_REPO: vial-kb/vial-qmk
  QMK_BRANCH: vial
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout custom keymaps
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install QMK CLI
      run: |
        python -m pip install --upgrade pip
        pip install qmk
    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y gcc-arm-none-eabi avr-libc gcc-avr binutils-avr
    - name: Clone QMK fork
      run: |
        git clone --no-checkout https://github.com/$QMK_REPO.git --depth 1 --branch $QMK_BRANCH ./qmk_firmware
    - name: Determine & Checkout relevant keyboards
      working-directory: ./qmk_firmware
      run: |
        git config core.sparsecheckout true
        printf '/*\n!/keyboards\n' > .git/info/sparse-checkout
        for kb in $(find ../keyboards -depth -type d | awk '$0 !~ /keymaps/' | awk -F / 'NF>=p; {p=NF}' | sed 's/..//'); do echo "$kb/*" >> .git/info/sparse-checkout; done;
        printf '!/keyboards/**/keymaps\n' >> .git/info/sparse-checkout
        git checkout $QMK_BRANCH --
    - name: Set Up QMK
      working-directory: ./qmk_firmware
      run: |
        qmk setup -y
    - name: Copy keymap
      run: |
        mkdir -p qmk_firmware/keyboards/
        cp -rup ./keyboards/* ./qmk_firmware/keyboards/
    - name: Patch AVR-specific files for RP2040
      run: |
        cat > ./qmk_firmware/keyboards/nullbitsco/common/bitc_led.c << 'EOF'
        #include "bitc_led.h"
        void set_bitc_LED(uint8_t mode) {}
        EOF
        cat > ./qmk_firmware/keyboards/nullbitsco/common/remote_kb.c << 'EOF'
        #include "remote_kb.h"
        void matrix_init_remote_kb(void) {}
        void matrix_scan_remote_kb(void) {}
        EOF
        cat > ./qmk_firmware/platforms/chibios/drivers/uart_sio.c << 'EOF'
        #include <stdint.h>
        #include <stdbool.h>
        void uart_init(uint32_t baud) {}
        void uart_write(uint8_t data) {}
        uint8_t uart_read(void) { return 0; }
        void uart_transmit(const uint8_t *data, uint16_t length) {}
        void uart_receive(uint8_t *data, uint16_t length) {}
        bool uart_available(void) { return false; }
        EOF
    - name: Compile Custom Firmware
      working-directory: ./qmk_firmware
      run: |
        make nullbitsco/nibble:custom-vial CONVERT_TO=bit_c_pro 2>&1
        echo "Exit code: $?"
    - name: Find output files
      run: |
        find ./qmk_firmware -name "*.uf2" -o -name "*.hex" -o -name "*.bin" 2>/dev/null
        echo "--- checking .build ---"
        find ./qmk_firmware/.build -type f 2>/dev/null || echo "No .build folder found"
    - name: Upload compiled firmware (build artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Firmware Files
        path: |
          ./qmk_firmware/*.hex
          ./qmk_firmware/*.bin
          ./qmk_firmware/*.uf2
